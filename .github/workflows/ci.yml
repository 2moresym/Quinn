name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "voice"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}
      - run: cargo clippy --workspace --all-targets ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }} -- -D warnings

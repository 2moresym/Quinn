name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: default
            feature_args: ""
          - name: voice
            feature_args: "--features voice"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets ${{ matrix.feature_args }}
      - run: cargo clippy --workspace --all-targets ${{ matrix.feature_args }} -- -D warnings

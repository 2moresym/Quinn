[package]
name = "quinn-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"

[dependencies]
needle-infer = "0.2.1"
zbus = "5.19"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
